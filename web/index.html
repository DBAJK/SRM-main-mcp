<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슬라이스 실험 실행기</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#e3e6eb; --ink:#1a1d21; --dim:#6b7280;
  --accent:#2563eb; --ok:#059669; --warn:#b45309; --err:#dc2626;
  --term-bg:#12151a; --term-ink:#d7dce4;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#171a20; --line:#272b33; --ink:#e6e9ee; --dim:#9aa2ad;
    --accent:#60a5fa; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    --term-bg:#0a0c10; --term-ink:#cbd3de;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --line:#272b33; --ink:#e6e9ee; --dim:#9aa2ad;
  --accent:#60a5fa; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  --term-bg:#0a0c10; --term-ink:#cbd3de;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,
  "Segoe UI","Malgun Gothic",system-ui,sans-serif;
}
.wrap{max-width:1240px; margin:0 auto; padding:24px 16px 64px}
header{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:18px}
h1{font-size:19px; margin:0; letter-spacing:-.01em}
.sub{color:var(--dim); font-size:13px}
.grid{display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:18px; align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px}
.card h2{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
  margin:0 0 12px; font-weight:600}
.row{display:grid; grid-template-columns:96px minmax(0,1fr); gap:10px; align-items:center; margin-bottom:9px}
label{font-size:13px; color:var(--dim)}
select,input[type=text],input[type=number]{
  width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px;
  background:var(--bg); color:var(--ink); font:inherit; font-size:13px;
}
select:focus,input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.checks{display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 4px}
.checks label{display:flex; align-items:center; gap:6px; color:var(--ink); font-size:13px; cursor:pointer}
.presets{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.presets button{
  padding:5px 10px; font-size:12px; border:1px solid var(--line); border-radius:999px;
  background:var(--bg); color:var(--ink); cursor:pointer;
}
.presets button:hover{border-color:var(--accent); color:var(--accent)}
.cmd{
  font:12px/1.55 ui-monospace,Consolas,"Cascadia Mono",monospace; background:var(--bg);
  border:1px solid var(--line); border-radius:7px; padding:9px 10px; color:var(--dim);
  word-break:break-all; margin:12px 0;
}
.est{font-size:12px; color:var(--dim); margin-bottom:12px}
.est b{color:var(--ink); font-weight:600}
.actions{display:flex; gap:8px}
button.primary{
  flex:1; padding:10px 14px; border:0; border-radius:8px; background:var(--accent);
  color:#fff; font:inherit; font-weight:600; font-size:14px; cursor:pointer;
}
button.primary:disabled{opacity:.5; cursor:not-allowed}
button.ghost{
  padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:transparent;
  color:var(--ink); font:inherit; font-size:14px; cursor:pointer;
}
.status{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:10px; min-height:22px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none}
.dot.run{background:var(--accent); animation:pulse 1.2s ease-in-out infinite}
.dot.ok{background:var(--ok)} .dot.err{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
pre.term{
  background:var(--term-bg); color:var(--term-ink); border-radius:8px; padding:12px 14px;
  font:12px/1.6 ui-monospace,Consolas,"Cascadia Mono",monospace; margin:0;
  height:460px; overflow:auto; white-space:pre-wrap; word-break:break-word;
}
pre.term .hl{color:#7dd3fc}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--line)}
th{color:var(--dim); font-weight:600; font-size:12px}
td.mono{font:12px ui-monospace,Consolas,monospace}
td button{
  padding:3px 8px; font-size:12px; border:1px solid var(--line); border-radius:6px;
  background:transparent; color:var(--ink); cursor:pointer; margin-right:4px;
}
td button:hover{border-color:var(--accent); color:var(--accent)}
.score{font:12px/1.6 ui-monospace,Consolas,monospace; background:var(--bg);
  border:1px solid var(--line); border-radius:7px; padding:10px; margin-top:10px;
  white-space:pre-wrap; display:none}
.note{font-size:12px; color:var(--dim); margin-top:10px}
.note b{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>슬라이스 실험 실행기</h1>
    <span class="sub">SRM-main-mcp · 로컬 전용</span>
  </header>

  <div class="grid">
    <!-- ── 옵션 ── -->
    <div class="card">
      <h2>실행 설정</h2>

      <div class="presets">
        <button data-preset="rule">규칙 · 무료</button>
        <button data-preset="fixed">고정 루프 · LLM</button>
        <button data-preset="orch">오케스트레이터</button>
        <button data-preset="mock">목 · 빠름</button>
      </div>

      <div class="row"><label>드라이버</label><select id="driver">
        <option value="fixed">fixed — 파이썬이 순서</option>
        <option value="orchestrator">orchestrator — LLM 이 도구를 듦</option>
      </select></div>

      <div class="row"><label>시나리오</label><select id="scenario">
        <option>normal</option><option>emergency</option>
        <option>special_event</option><option>iot_surge</option>
        <option selected>mixed</option>
      </select></div>

      <div class="row"><label>시드</label><input id="seed" type="number" value="0" min="0"></div>
      <div class="row"><label>스텝</label><input id="steps" type="number" value="10" min="1"
        placeholder="비우면 시나리오 전체"></div>
      <div class="row"><label>비교군</label><input id="arm" type="text" value="proposed"></div>

      <div id="fixedOnly">
        <div class="row"><label>백엔드</label><select id="backend">
          <option value="mcp">mcp — 실서버</option>
          <option value="mock">mock — 가짜</option>
        </select></div>
        <div class="row"><label>판단자</label><select id="decider">
          <option value="rule">rule — LLM 안 씀</option>
          <option value="llm">llm</option>
        </select></div>
      </div>

      <div class="row"><label>모델</label><select id="llm_model">
        <option>sonnet</option><option>haiku</option><option>opus</option>
      </select></div>

      <div class="row"><label>⑤ 메모리</label><select id="memory_mode">
        <option value="cold">cold — 격리</option>
        <option value="warm">warm — 누적</option>
      </select></div>

      <div class="row"><label>② 설명</label><select id="desc_mode">
        <option value="minimal">minimal</option><option value="advisory">advisory</option>
      </select></div>

      <div id="orchOnly" style="display:none">
        <div class="row"><label>호출 상한</label><input id="max_calls" type="number" value="20" min="1"></div>
        <div class="row"><label>스텝 예산</label><input id="step_budget_usd" type="number" value="0.5" step="0.05"></div>
      </div>

      <div class="row"><label>의도</label><input id="intent" type="text"
        placeholder="비워두면 관측만으로 판단"></div>

      <div class="checks">
        <label><input type="checkbox" id="fresh" checked> fresh</label>
        <label><input type="checkbox" id="trace"> trace</label>
        <label><input type="checkbox" id="quiet"> quiet</label>
      </div>

      <div class="cmd" id="cmd">…</div>
      <div class="est" id="est"></div>

      <div class="actions">
        <button class="primary" id="go">실행</button>
        <button class="ghost" id="stop" disabled>중지</button>
      </div>

      <div class="note">의도를 주실 땐 <b>시나리오와 맞춰야</b> 합니다. 어긋나면
        거짓 정보를 먹이는 셈이라 정확도가 무너집니다.</div>
    </div>

    <!-- ── 출력 ── -->
    <div>
      <div class="card" style="margin-bottom:18px">
        <h2>출력</h2>
        <div class="status"><span class="dot" id="dot"></span><span id="stat">대기 중</span></div>
        <pre class="term" id="term">실행을 누르면 여기에 출력이 흐릅니다.</pre>
      </div>

      <div class="card">
        <h2>지난 실행</h2>
        <table><thead><tr><th>run_id</th><th style="width:200px">작업</th></tr></thead>
          <tbody id="runs"><tr><td colspan="2" style="color:var(--dim)">불러오는 중…</td></tr></tbody>
        </table>
        <div class="score" id="score"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const F = {
  driver:$('driver'), scenario:$('scenario'), seed:$('seed'), steps:$('steps'),
  arm:$('arm'), backend:$('backend'), decider:$('decider'), llm_model:$('llm_model'),
  memory_mode:$('memory_mode'), desc_mode:$('desc_mode'), max_calls:$('max_calls'),
  step_budget_usd:$('step_budget_usd'), intent:$('intent'),
  fresh:$('fresh'), trace:$('trace'), quiet:$('quiet'),
};

function form(){
  const o = {};
  for (const [k,el] of Object.entries(F))
    o[k] = el.type === 'checkbox' ? el.checked : el.value;
  if (o.driver === 'orchestrator'){ delete o.backend; delete o.decider; }
  return o;
}

// 서버의 build_argv 와 같은 규칙으로 미리 보여준다
function preview(){
  const o = form(), a = [];
  for (const k of ['driver','scenario','backend','decider','desc_mode','memory_mode','llm_model'])
    if (o[k]) a.push(`--${k.replace(/_/g,'-')} ${o[k]}`);
  for (const k of ['seed','steps','max_calls','step_budget_usd'])
    if (o[k] !== undefined && String(o[k]).trim() !== '') a.push(`--${k.replace(/_/g,'-')} ${o[k]}`);
  if (o.arm) a.push(`--arm ${o.arm}`);
  if (o.intent) a.push(`--intent "${o.intent}"`);
  for (const k of ['fresh','trace','quiet']) if (o[k]) a.push(`--${k}`);
  $('cmd').textContent = 'run.py ' + a.join(' ');

  const orch = o.driver === 'orchestrator';
  $('orchOnly').style.display = orch ? '' : 'none';
  $('fixedOnly').style.display = orch ? 'none' : '';

  const total = o.steps ? +o.steps : (o.scenario === 'mixed' ? 120 : 60);
  const usesLLM = orch || o.decider === 'llm';
  let msg;
  if (!usesLLM) msg = `<b>${total}</b>스텝 · LLM 안 씀 · 사용량 0 · 1분 내외`;
  else {
    const per = orch ? 50 : 17, cost = orch ? 0.09 : 0.048;
    const m = Math.round(total*per/60);
    msg = `<b>${total}</b>스텝 · 약 <b>${m}분</b> · 구독 사용량 환산 약 <b>$${(total*cost).toFixed(2)}</b>`;
  }
  $('est').innerHTML = msg + (usesLLM ? ' <span style="opacity:.7">(별도 청구 아님)</span>' : '');
}
Object.values(F).forEach(el => el.addEventListener('input', preview));

const PRESETS = {
  rule:{driver:'fixed', backend:'mcp', decider:'rule', steps:15, scenario:'emergency'},
  fixed:{driver:'fixed', backend:'mcp', decider:'llm', steps:10, scenario:'mixed'},
  orch:{driver:'orchestrator', steps:5, scenario:'mixed'},
  mock:{driver:'fixed', backend:'mock', decider:'rule', steps:20, scenario:'normal'},
};
document.querySelectorAll('.presets button').forEach(b =>
  b.onclick = () => { Object.entries(PRESETS[b.dataset.preset]).forEach(([k,v]) => {
    if (F[k]) F[k].value = v; }); preview(); });

let job = null, since = 0, timer = null;
function setStat(cls, text){ $('dot').className = 'dot ' + cls; $('stat').textContent = text; }

$('go').onclick = async () => {
  $('go').disabled = true; $('stop').disabled = false;
  $('term').textContent = ''; since = 0;
  setStat('run', '시작하는 중…');
  const r = await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'},
                                     body: JSON.stringify(form())}).then(r=>r.json());
  job = r.job;
  setStat('run', `실행 중 · ${r.run_id}`);
  timer = setInterval(poll, 700);
};

$('stop').onclick = async () => {
  if (!job) return;
  await fetch('/api/stop', {method:'POST', headers:{'Content-Type':'application/json'},
                            body: JSON.stringify({job})});
};

async function poll(){
  if (!job) return;
  const r = await fetch(`/api/job?id=${job}&since=${since}`).then(r=>r.json());
  if (r.error) return;
  if (r.lines.length){
    const t = $('term'), atEnd = t.scrollTop + t.clientHeight >= t.scrollHeight - 30;
    t.textContent += (t.textContent ? '\n' : '') + r.lines.join('\n');
    if (atEnd) t.scrollTop = t.scrollHeight;
    since = r.next;
  }
  if (r.done){
    clearInterval(timer); timer = null;
    $('go').disabled = false; $('stop').disabled = true;
    setStat(r.code === 0 ? 'ok' : 'err',
            r.code === 0 ? `완료 · ${r.run_id} · ${r.elapsed}초` : `종료 코드 ${r.code}`);
    loadRuns();
  } else setStat('run', `실행 중 · ${r.run_id} · ${r.elapsed}초`);
}

async function loadRuns(){
  const r = await fetch('/api/runs').then(r=>r.json());
  const tb = $('runs');
  if (!r.runs.length){ tb.innerHTML = '<tr><td colspan="2" style="color:var(--dim)">아직 없습니다</td></tr>'; return; }
  tb.innerHTML = r.runs.map(x => `<tr>
    <td class="mono">${x.run_id}</td>
    <td>
      <button onclick="doScore('${x.run_id}')">채점</button>
      ${x.report ? `<button onclick="window.open('/report?run_id=${x.run_id}')">리포트</button>`
                 : `<button onclick="mkReport('${x.run_id}', this)">리포트 생성</button>`}
    </td></tr>`).join('');
}

async function doScore(id){
  const box = $('score');
  box.style.display = 'block'; box.textContent = `${id} 채점 중…`;
  const r = await fetch(`/api/score?run_id=${encodeURIComponent(id)}`).then(r=>r.json());
  if (r.error){ box.textContent = `${id}\n\n오류: ${r.error}`; return; }
  const pa = r.perception_accuracy || {}, ep = r.escalation_precision || {};
  box.textContent =
`${id}

상황 인지 정확도   ${pa.accuracy ?? '-'}   (${pa.correct ?? '-'}/${pa.n ?? '-'})
개입 정밀도        ${ep.precision ?? '-'}   (${ep.correct ?? '-'}/${ep.n ?? '-'})
제외된 전환 스텝   ${(r.excluded_transition_steps||[]).join(', ') || '없음'}

혼동 행렬 (정답 → 예측)
${Object.entries(pa.confusion||{}).map(([t,p]) =>
  `  ${t.padEnd(14)} ${Object.entries(p).map(([k,v])=>`${k} ${v}`).join(' · ')}`).join('\n')}`;
}

async function mkReport(id, btn){
  btn.disabled = true; btn.textContent = '생성 중…';
  const r = await fetch('/api/report', {method:'POST', headers:{'Content-Type':'application/json'},
                                        body: JSON.stringify({run_id:id})}).then(r=>r.json());
  if (r.ok) window.open(`/report?run_id=${id}`); else alert(r.out || '생성 실패');
  loadRuns();
}
window.doScore = doScore; window.mkReport = mkReport;

preview(); loadRuns();
</script>
</body>
</html>
